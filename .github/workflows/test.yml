name: Test and Security

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 22.x
  BACKEND_PATH: backend/LocalMindAI.Api
  FRONTEND_PATH: frontend

jobs:
  backend-tests:
    name: Backend tests and dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore
        working-directory: ${{ env.BACKEND_PATH }}
      - name: Run backend tests when present
        shell: bash
        run: |
          mapfile -t projects < <(find ../../ -type f -name '*Tests.csproj' -not -path '*/bin/*' -not -path '*/obj/*')
          if [ "${#projects[@]}" -eq 0 ]; then
            echo 'No backend test projects found; skipping.'
            exit 0
          fi
          for project in "${projects[@]}"; do
            dotnet test "$project" -c Release --no-restore
          done
        working-directory: ${{ env.BACKEND_PATH }}
      - name: Scan NuGet dependencies for known vulnerabilities
        run: dotnet list package --vulnerable --include-transitive
        working-directory: ${{ env.BACKEND_PATH }}

  frontend-tests:
    name: Frontend tests and dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
        working-directory: ${{ env.FRONTEND_PATH }}
      - name: Run frontend tests when a test script is defined
        shell: bash
        run: |
          if node -e "const scripts=require('./package.json').scripts || {}; process.exit(scripts.test ? 0 : 1)"; then
            npm run test -- --run
          else
            echo 'No frontend test script found; skipping.'
          fi
        working-directory: ${{ env.FRONTEND_PATH }}
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: ${{ env.FRONTEND_PATH }}

  secrets:
    name: Secret scanning readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
