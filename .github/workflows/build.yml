name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 22.x
  BACKEND_PATH: backend/LocalMindAI.Api
  FRONTEND_PATH: frontend

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore
        working-directory: ${{ env.BACKEND_PATH }}
      - name: Build release
        run: dotnet build -c Release --no-restore
        working-directory: ${{ env.BACKEND_PATH }}
      - name: Verify formatting when the SDK formatter is available
        shell: bash
        run: |
          if dotnet format --help >/dev/null 2>&1; then
            dotnet format --verify-no-changes --no-restore
          else
            echo 'dotnet format is unavailable in this SDK image; skipping verification.'
          fi
        working-directory: ${{ env.BACKEND_PATH }}
      - name: Publish backend artifact
        run: dotnet publish -c Release --no-restore --output "$RUNNER_TEMP/backend"
        working-directory: ${{ env.BACKEND_PATH }}
      - uses: actions/upload-artifact@v4
        with:
          name: backend-release
          path: ${{ runner.temp }}/backend
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
        working-directory: ${{ env.FRONTEND_PATH }}
      - name: Lint
        run: npm run lint
        working-directory: ${{ env.FRONTEND_PATH }}
      - name: Build
        run: npm run build
        working-directory: ${{ env.FRONTEND_PATH }}
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-release
          path: frontend/dist
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Docker Compose build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      SQL_SA_PASSWORD: CiSqlPassword!123
      JWT_KEY: ci-verification-key-that-is-longer-than-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - name: Build all container images
        run: docker compose build
      - name: Publish image metadata
        run: docker compose images --format json > "$RUNNER_TEMP/docker-images.json"
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image-metadata
          path: ${{ runner.temp }}/docker-images.json
          if-no-files-found: error
          retention-days: 14
