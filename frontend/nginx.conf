server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location = /index.html { add_header Cache-Control "no-store" always; try_files $uri =404; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
  location /api/ { proxy_pass http://backend:8080/api/; proxy_set_header Host $host; }
  location /hubs/ { proxy_pass http://backend:8080/hubs/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; }
}
