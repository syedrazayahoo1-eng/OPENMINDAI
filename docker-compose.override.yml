services:
  frontend:
    build:
      target: development
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:5016/api
    ports: !reset
      - "5173:5173"
    healthcheck:
      disable: true
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  backend:
    build:
      target: development
    command: dotnet watch run --no-launch-profile --urls http://0.0.0.0:8080
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Provider: Sqlite
      ConnectionStrings__DefaultConnection: Data Source=/app/data/LocalMindAI.dev.db
      Cors__AllowedOrigins__0: http://localhost:5173
      AllowedHosts: localhost;backend
    volumes:
      - ./backend/LocalMindAI.Api:/src
      - backend_dev_data:/app/data

volumes:
  frontend_node_modules:
  backend_dev_data:
